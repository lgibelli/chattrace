name: Release

# Push a release/<version> branch (e.g. release/0.2.0), or run it manually from the
# Actions tab. Builds macOS (universal; Developer ID signed + notarized when the
# secrets exist), Windows x64 and Linux x86_64, signs SHA256SUMS with the updater's
# minisign key, and attaches everything to a DRAFT release. Check the draft and
# publish it by hand: only then do the in-app updater and the website see it.
#
# Secrets (set with scripts/set-ci-secrets.sh): MACOS_CERT_P12_BASE64,
# MACOS_CERT_PASSWORD, APPLE_API_KEY_B64, APPLE_API_KEY_ID, APPLE_API_ISSUER,
# MINISIGN_KEY. Variable: MACOS_SIGNING_IDENTITY. Never reachable from pull requests.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Create the draft release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<NOTES
          ChatTrace Forensic $V

          **Use Microsoft Purview whenever you have access to it.** ChatTrace is for when you don't:
          it preserves, read-only, what one Teams desktop client cached on one computer.

          Downloads: macOS (universal DMG, signed and notarized), Windows x64 (zip: \`chattrace.exe\` app and
          \`chattrace-cli.exe\` command line), Linux x86_64 (zip). Verify with \`SHA256SUMS\`; \`SHA256SUMS.minisig\`
          is its minisign signature (public key in \`assets/updater.pub\`).
          NOTES
          gh release create "v$V" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "ChatTrace Forensic $V" --notes-file notes.md

  macos:
    needs: draft
    runs-on: macos-latest
    env:
      V: ${{ needs.draft.outputs.version }}
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_API_KEY_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos
          cache-bin: false
      # Pinned to a full SHA: this step receives the signing certificate.
      - name: Import Developer ID certificate
        if: env.HAVE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Write the notary API key
        if: env.HAVE_NOTARY == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && vars.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_B64 != '' && format('{0}/notary.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/build-macos.sh
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$V" -R "$GITHUB_REPOSITORY" --clobber dist/ChatTrace-Forensic-*.dmg dist/ChatTrace-Forensic-*.zip
      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

  windows:
    needs: draft
    runs-on: windows-latest
    env:
      V: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
          cache-bin: false
      - run: cargo build --release --locked --bin chattrace --bin chattrace-cli
      - name: Package
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force -Path stage
          Copy-Item target\release\chattrace.exe, target\release\chattrace-cli.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt $stage
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path stage\* -DestinationPath "dist\ChatTrace-Forensic-$env:V-windows-x64.zip" -Force
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$V" -R "$GITHUB_REPOSITORY" --clobber dist/ChatTrace-Forensic-*.zip

  linux:
    needs: draft
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev zip
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
          cache-bin: false
      - run: cargo build --release --locked --bin chattrace --bin chattrace-cli
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage dist
          cp target/release/chattrace target/release/chattrace-cli README.md LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt stage/
          (cd stage && zip -qr -X "../dist/ChatTrace-Forensic-$V-linux-x86_64.zip" .)
          gh release upload "v$V" -R "$GITHUB_REPOSITORY" --clobber dist/ChatTrace-Forensic-*.zip

  checksums:
    needs: [draft, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.draft.outputs.version }}
    steps:
      - name: SHA256SUMS + minisign signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          mkdir dist && cd dist
          gh release download "v$V" -R "$GITHUB_REPOSITORY" -p 'ChatTrace-Forensic-*'
          sha256sum ChatTrace-Forensic-* > SHA256SUMS
          cat SHA256SUMS
          files=(SHA256SUMS)
          if [ -n "$MINISIGN_KEY" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
            printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -x SHA256SUMS.minisig -t "ChatTrace Forensic $V"
            rm -f "$RUNNER_TEMP/minisign.key"
            files+=(SHA256SUMS.minisig)
          else
            echo "::warning::MINISIGN_KEY is not set: the in-app updater will refuse this release"
          fi
          gh release upload "v$V" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
